server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pharmago-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/pharmago_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: UGhhcm1BR29TdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNlNlY3VyZVByb2R1Y3Rpb25LZXk=
    expiration-ms: 3600000        # 60 Minutes
    refresh-expiration-ms: 604800000 # 7 Days

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      model: gpt-3.5-turbo
      api-url: https://api.openai.com/v1/chat/completions
